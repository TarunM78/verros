name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Python bundle for the browser
        run: python verros_tools/web/build_bundle.py

      - name: Run library tests (headless)
        run: |
          python -m pip install -q -r verros_tools/pygeartrain/requirements.txt
          python -m pip install -q --no-deps git+https://github.com/eelcohoogendoorn/pycomplex.git
          # pycomplex declares two C-only deps that have no wheels; the same shims the browser uses
          SITE=$(python -c "import site; print(site.getsitepackages()[0])")
          python - <<'EOF'
          import zipfile, site
          z = zipfile.ZipFile('verros_tools/web/dist/bundle.zip')
          sp = site.getsitepackages()[0]
          for name in ('fastcache.py', 'pycosat.py'):
              open(f'{sp}/{name}', 'w').write(z.read(name).decode())
          EOF
          cd verros_tools/pygeartrain && MPLBACKEND=Agg python -m pytest pygeartrain/test pygeartrain/core/pga.py -q

      - name: Check the page for duplicate element ids and dangling references
        run: |
          python - <<'EOF'
          import re, sys
          html = open('verros_tools/web/index.html', encoding='utf-8').read()
          ids = re.findall(r'\bid="([^"]+)"', html)
          dups = sorted({i for i in ids if ids.count(i) > 1})
          js = open('verros_tools/web/app.js', encoding='utf-8').read()
          used = set(re.findall(r"\$\('([^']+)'\)", js))
          missing = sorted(used - set(ids) - {'loading', 'loading-text', 'loading-bar'})
          missing = [m for m in missing if not m.startswith('param-') and not m.startswith('kin-')]
          if dups or missing:
              print('duplicate ids:', dups); print('ids used in app.js but absent from index.html:', missing); sys.exit(1)
          print(f'{len(ids)} unique ids, all app.js references resolve')
          EOF

      - name: Prepare site
        run: |
          mkdir -p site
          cd verros_tools/web && cp -r index.html app.js worker.js style.css dist step ../../site/ && cd ../..
          touch site/.nojekyll
          # cache-bust every script reference with the commit id (Pages caches for 10 min)
          sed -i "s/__BUILD__/${GITHUB_SHA::8}/g" site/index.html site/app.js site/step/cad-worker.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
